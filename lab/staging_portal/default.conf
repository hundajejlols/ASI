server {
    listen 80;
    listen 443 ssl;
    server_name staging-portal.agh.local;

    ssl_certificate     /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;

    root /usr/share/nginx/html;
    index index.html;

    # Celowe nagłówki i ciasteczko sesyjne do demonstracji pasywnych sygnatur ASI
    add_header X-Powered-By "PHP/7.4.33" always;
    add_header X-Environment "staging" always;
    add_header Set-Cookie "PHPSESSID=demo123staging; Path=/; HttpOnly" always;

    location = / {
        try_files /index.html =404;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location = /login {
        try_files /login.html =404;
    }

    # Wszystkie inne ścieżki (w tym sonda soft-404) zwracają prawdziwe 404
    location / {
        return 404 "404 Not Found\n";
    }
}
