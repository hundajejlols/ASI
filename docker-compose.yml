services:
  postgres:
    image: postgres:16-alpine
    container_name: asi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-asi_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asi_user} -d ${POSTGRES_DB:-asi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: asi_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-changeme_strong_redis_password}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-changeme_strong_redis_password} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asi_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://asi_user:changeme_strong_db_password@postgres:5432/asi_db}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme_strong_redis_password}@redis:6379/0}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      ALLOW_WEAK_ENCRYPTION_KEY: ${ALLOW_WEAK_ENCRYPTION_KEY:-true}
      ALLOW_DEV_ROLE_HEADER: ${ALLOW_DEV_ROLE_HEADER:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme_generate_random_jwt_secret_min_32_chars}
      SCANNER_INTERNAL_TOKEN: ${SCANNER_INTERNAL_TOKEN:-changeme_internal_scanner_token}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net

  scanner:
    build:
      context: ./scanner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-changeme_strong_redis_password}@redis:6379/0}
      REDIS_JOB_QUEUE: ${REDIS_JOB_QUEUE:-asi:scan:chunks}
      SCANNER_WORKER_ID: ${SCANNER_WORKER_ID:-}
      SCANNER_CHUNK_WORKERS: ${SCANNER_CHUNK_WORKERS:-2}
      SCANNER_CONCURRENCY: ${SCANNER_CONCURRENCY:-4}
      SCANNER_RATE_LIMIT_PPS: ${SCANNER_RATE_LIMIT_PPS:-300}
      SCANNER_HTTP_MAX_RPS: ${SCANNER_HTTP_MAX_RPS:-20}
      SCANNER_HTTP_TIMEOUT_SEC: ${SCANNER_HTTP_TIMEOUT_SEC:-8}
      BACKEND_INGEST_URL: ${BACKEND_INGEST_URL:-http://backend:8000/api/v1/scans/ingest}
      SCANNER_INTERNAL_TOKEN: ${SCANNER_INTERNAL_TOKEN:-changeme_internal_scanner_token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app_net
      - lab_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asi_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:5173"
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - app_net

  # ===========================================================================
  # Izolowane środowisko testowe (lab_net) - bezpieczne cele dla skanera
  # ===========================================================================
  lab_web_nginx:
    image: nginx:alpine
    container_name: asi_lab_nginx
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.28.0.10

  lab_whoami:
    image: traefik/whoami:latest
    container_name: asi_lab_whoami
    restart: unless-stopped
    networks:
      lab_net:
        ipv4_address: 172.28.0.11

  lab_staging_portal:
    build:
      context: ./lab/staging_portal
      dockerfile: Dockerfile
    container_name: asi_lab_staging
    restart: unless-stopped
    volumes:
      - ./lab/staging_portal/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/staging_portal/html:/usr/share/nginx/html:ro
    networks:
      lab_net:
        ipv4_address: 172.28.0.12

networks:
  app_net:
    driver: bridge
  lab_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  redisdata:
